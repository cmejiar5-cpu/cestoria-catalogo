name: Pruebas y diagnóstico
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de un despliegue de Netlify para verificar (opcional)"
        required: false
  push:
    branches: [ccr-625e2fca-7eiwjz]
    paths: [scripts/**, netlify/functions/**, netlify/lib/**, admin.html, index.html, package.json, .github/workflows/diagnose-amazon.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - if: ${{ inputs.base_url }}
        run: node scripts/check-deploy.mjs "${{ inputs.base_url }}"
      - run: node scripts/inspect-feed-ids.mjs
      - run: node scripts/preview-feed.mjs CO,PE,EC
      - run: node scripts/diagnose-amazon.mjs https://link.amazon/B02KjkcGI
